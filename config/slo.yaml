service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Baseline CP2 có latency dưới 3000ms; giữ ngưỡng này để phát hiện regression ảnh hưởng người dùng. Budget = tổng request * 0.005; 10,000 request cho phép tối đa 50 request lỗi hoặc chậm. Baseline lab ngắn chưa chứng minh SLO trong 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
